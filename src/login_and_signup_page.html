<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Marginalia &mdash; a home for readers &amp; writers</title>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap');

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  #root{ min-height:100vh; }

  :root{
    --ink:#1B2A3C;
    --parchment:#E7E1D0;
    --parchment-light:#F1ECDD;
    --moss:#4A6741;
    --gold:#B8935F;
    --burgundy:#6B2737;
    --charcoal:#2A2620;
    --line: rgba(42,38,32,0.16);
  }
  .app-root{
    font-family:'Source Serif 4', Georgia, serif;
    background:var(--parchment);
    color:var(--charcoal);
    min-height:100vh;
    width:100%;
    display:flex;
    background-image: radial-gradient(rgba(42,38,32,0.035) 1px, transparent 1px);
    background-size:3px 3px;
  }
  h1,h2,h3,.display{ font-family:'Fraunces', serif; }
  .mono{ font-family:'JetBrains Mono', monospace; }

  .shell{ display:flex; width:100%; max-width:1180px; margin:0 auto; min-height:100vh; }
  .sidebar{ width:236px; flex-shrink:0; border-right:1px solid var(--line); padding:28px 16px; display:flex; flex-direction:column; gap:26px; }
  .brand{ padding:0 6px; }
  .brand-mark{ display:flex; align-items:center; gap:9px; color:var(--ink); }
  .brand-title{ font-size:21px; font-weight:600; letter-spacing:0.01em; }
  .brand-tag{ font-size:10.5px; letter-spacing:0.14em; color:var(--burgundy); text-transform:uppercase; margin-top:3px; padding-left:1px; }

  .catalog{ display:flex; flex-direction:column; gap:8px; }
  .catalog-caption{ font-size:10px; letter-spacing:0.16em; text-transform:uppercase; color:var(--charcoal); opacity:0.55; padding:0 6px; margin-bottom:2px; }

  .drawer-btn{ display:flex; align-items:center; gap:11px; width:100%; text-align:left; background:var(--parchment-light); border:1px solid var(--line); border-radius:3px; padding:10px 12px; cursor:pointer; color:var(--charcoal); box-shadow: 0 1px 0 rgba(42,38,32,0.05); transition: transform 0.12s ease, border-color 0.12s ease; position:relative; }
  .drawer-btn:hover{ border-color:var(--gold); transform:translateX(1px); }
  .drawer-btn-active{ background:var(--ink); color:var(--parchment-light); border-color:var(--ink); }
  .drawer-btn-active .drawer-sub{ color:rgba(231,225,208,0.6); }
  .drawer-btn-text{ display:flex; flex-direction:column; line-height:1.25; }
  .drawer-label{ font-size:13.5px; font-weight:600; }
  .drawer-sub{ font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:0.08em; color:var(--charcoal); opacity:0.5; text-transform:uppercase; }
  .drawer-badge{ margin-left:auto; background:var(--burgundy); color:#F1ECDD; font-family:'JetBrains Mono',monospace; font-size:10px; padding:1px 6px; border-radius:10px; }

  .sidebar-foot{ margin-top:auto; padding:12px 6px 0; border-top:1px solid var(--line); display:flex; align-items:center; gap:10px; }
  .sidebar-foot-name{ font-size:12.5px; font-weight:600; }
  .sidebar-foot-handle{ font-family:'JetBrains Mono',monospace; font-size:10.5px; opacity:0.55; }

  .main{ flex:1; min-width:0; padding:28px 32px 60px; }
  .main-header{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:22px; }
  .main-title{ font-size:26px; font-weight:600; margin:0; }
  .main-sub{ font-size:12.5px; opacity:0.6; margin-top:3px; }

  .card{ background:var(--parchment-light); border:1px solid var(--line); border-radius:4px; }

  .stamp{ font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:0.06em; border:1px solid var(--burgundy); color:var(--burgundy); padding:2px 6px; border-radius:2px; transform:rotate(-2deg); display:inline-block; white-space:nowrap; }

  .avatar-circle{ border-radius:50%; display:flex; align-items:center; justify-content:center; color:#F1ECDD; font-weight:600; font-family:'Fraunces',serif; flex-shrink:0; }

  .composer{ padding:16px 18px; margin-bottom:22px; }
  .composer textarea{ width:100%; resize:none; border:none; background:transparent; font-family:'Source Serif 4',serif; font-size:15px; line-height:1.5; outline:none; min-height:52px; color:var(--charcoal); }
  .composer textarea::placeholder{ color:rgba(42,38,32,0.4); font-style:italic; }
  .composer-foot{ display:flex; justify-content:space-between; align-items:center; margin-top:8px; border-top:1px dashed var(--line); padding-top:10px; }

  .btn-primary{ background:var(--ink); color:var(--parchment-light); border:none; padding:8px 16px; border-radius:3px; font-family:'Fraunces',serif; font-size:13px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:6px; }
  .btn-primary:hover{ background:var(--burgundy); }
  .btn-primary:disabled{ opacity:0.4; cursor:default; }
  .btn-secondary{ background:transparent; color:var(--ink); border:1px solid var(--ink); padding:7px 14px; border-radius:3px; font-family:'Fraunces',serif; font-size:12.5px; font-weight:600; cursor:pointer; }
  .btn-secondary:hover{ background:var(--ink); color:var(--parchment-light); }
  .btn-ghost{ background:transparent; border:none; cursor:pointer; color:var(--charcoal); opacity:0.65; display:flex; align-items:center; gap:5px; font-family:'JetBrains Mono',monospace; font-size:12px; }
  .btn-ghost:hover{ opacity:1; }
  .btn-ghost.liked{ color:var(--burgundy); opacity:1; }

  .feed-layout{ display:flex; gap:26px; align-items:flex-start; }
  .feed-main{ flex:1; min-width:0; }
  .feed-aside{ width:230px; flex-shrink:0; }

  .post{ padding:16px 18px; margin-bottom:14px; }
  .post-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:10px; }
  .post-who{ display:flex; gap:10px; }
  .post-name{ font-weight:600; font-size:14.5px; }
  .post-handle{ font-family:'JetBrains Mono',monospace; font-size:11px; opacity:0.55; }
  .post-body{ font-size:15px; line-height:1.62; margin-bottom:10px; margin-top:0; }
  .post-book{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--moss); margin-bottom:10px; }
  .post-foot{ display:flex; gap:18px; border-top:1px dashed var(--line); padding-top:9px; }

  .aside-card{ padding:14px 15px; margin-bottom:16px; }
  .aside-title{ font-size:11px; letter-spacing:0.1em; text-transform:uppercase; opacity:0.55; margin-bottom:11px; }
  .suggest-row{ display:flex; align-items:center; gap:9px; margin-bottom:12px; }
  .suggest-row:last-child{ margin-bottom:0; }
  .suggest-name{ font-size:12.5px; font-weight:600; line-height:1.2; }
  .suggest-handle{ font-family:'JetBrains Mono',monospace; font-size:10px; opacity:0.55; }
  .follow-pill{ margin-left:auto; font-family:'JetBrains Mono',monospace; font-size:10px; border:1px solid var(--ink); border-radius:12px; padding:3px 9px; background:transparent; cursor:pointer; }
  .follow-pill.active{ background:var(--ink); color:var(--parchment-light); }

  .profile-card{ padding:24px 26px; margin-bottom:22px; }
  .profile-top{ display:flex; gap:18px; align-items:flex-start; }
  .profile-name{ font-size:22px; font-weight:600; }
  .profile-handle{ font-family:'JetBrains Mono',monospace; font-size:12px; opacity:0.55; margin-top:2px; }
  .profile-bio{ font-size:14px; line-height:1.6; margin-top:10px; max-width:480px; }
  .profile-loc{ font-family:'JetBrains Mono',monospace; font-size:11px; opacity:0.55; margin-top:6px; }
  .profile-stats{ display:flex; gap:22px; margin-top:16px; }
  .stat-num{ font-size:17px; font-weight:600; font-family:'Fraunces',serif; }
  .stat-label{ font-size:10px; letter-spacing:0.08em; text-transform:uppercase; opacity:0.55; }

  .field-label{ font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; opacity:0.6; margin-bottom:5px; display:block; }
  .field-input, .field-textarea{ width:100%; border:1px solid var(--line); background:var(--parchment); border-radius:3px; padding:9px 11px; font-family:'Source Serif 4',serif; font-size:14px; color:var(--charcoal); outline:none; margin-bottom:14px; }
  .field-textarea{ resize:none; min-height:70px; }
  .field-input:focus, .field-textarea:focus{ border-color:var(--gold); }

  .shelf-section-title{ font-size:12px; letter-spacing:0.1em; text-transform:uppercase; opacity:0.6; margin:26px 0 12px; }
  .book-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(112px,1fr)); gap:14px; }
  .book-spine{ border-radius:3px; height:150px; padding:10px 9px; display:flex; flex-direction:column; justify-content:flex-end; color:#F1ECDD; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.12); }
  .book-spine-title{ font-family:'Fraunces',serif; font-weight:600; font-size:12.5px; line-height:1.25; }
  .book-spine-author{ font-family:'JetBrains Mono',monospace; font-size:9.5px; opacity:0.8; margin-top:4px; }
  .reading-row{ display:flex; gap:12px; }
  .reading-card{ flex:1; border-radius:3px; padding:12px; color:#F1ECDD; display:flex; flex-direction:column; justify-content:space-between; min-height:76px; }

  .msg-shell{ display:flex; border:1px solid var(--line); border-radius:4px; overflow:hidden; height:560px; background:var(--parchment-light); }
  .convo-list{ width:250px; flex-shrink:0; border-right:1px solid var(--line); overflow-y:auto; }
  .convo-item{ display:flex; gap:10px; padding:13px 14px; border-bottom:1px solid var(--line); cursor:pointer; }
  .convo-item:hover{ background:rgba(184,147,95,0.08); }
  .convo-item.active{ background:rgba(74,103,65,0.1); }
  .convo-name{ font-size:13px; font-weight:600; }
  .convo-last{ font-size:11.5px; opacity:0.6; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .unread-dot{ width:7px; height:7px; border-radius:50%; background:var(--burgundy); margin-left:auto; margin-top:5px; flex-shrink:0; }

  .thread{ flex:1; display:flex; flex-direction:column; min-width:0; }
  .thread-head{ padding:13px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; }
  .thread-body{ flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:10px; }
  .bubble{ max-width:70%; padding:9px 13px; border-radius:10px; font-size:13.5px; line-height:1.5; }
  .bubble.me{ align-self:flex-end; background:var(--ink); color:var(--parchment-light); border-bottom-right-radius:2px; }
  .bubble.them{ align-self:flex-start; background:var(--parchment); border:1px solid var(--line); border-bottom-left-radius:2px; }
  .bubble-time{ font-family:'JetBrains Mono',monospace; font-size:9px; opacity:0.55; margin-top:3px; }
  .thread-input{ display:flex; gap:8px; padding:12px; border-top:1px solid var(--line); }
  .thread-input input{ flex:1; border:1px solid var(--line); border-radius:20px; padding:9px 15px; font-family:'Source Serif 4',serif; font-size:13.5px; outline:none; background:var(--parchment); }
  .thread-input input:focus{ border-color:var(--gold); }
  .send-btn{ width:38px; height:38px; border-radius:50%; background:var(--ink); border:none; display:flex; align-items:center; justify-content:center; color:var(--parchment-light); cursor:pointer; flex-shrink:0; }
  .send-btn:hover{ background:var(--burgundy); }

  .lib-group{ margin-bottom:26px; }
  .lib-group-title{ font-size:13px; letter-spacing:0.08em; text-transform:uppercase; color:var(--burgundy); margin-bottom:11px; display:flex; align-items:center; gap:8px; }
  .lib-group-title::after{ content:""; flex:1; border-bottom:1px dashed var(--line); }
  .lib-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:12px; }
  .lib-card{ padding:15px 16px; display:flex; flex-direction:column; gap:8px; text-decoration:none; color:inherit; }
  .lib-card:hover{ border-color:var(--gold); }
  .lib-card-name{ font-weight:600; font-size:14px; display:flex; align-items:center; justify-content:space-between; }
  .lib-card-desc{ font-size:12.5px; opacity:0.7; line-height:1.5; }

  /* ---- auth ---- */
  .auth-page{ flex:1; display:flex; align-items:center; justify-content:center; padding:32px; width:100%; }
  .auth-card{ display:flex; width:100%; max-width:860px; min-height:520px; border:1px solid var(--line); border-radius:6px; overflow:hidden; box-shadow:0 18px 40px rgba(27,42,60,0.14); }
  .auth-side{ width:38%; flex-shrink:0; background:var(--ink); color:var(--parchment-light); padding:34px 28px; display:flex; flex-direction:column; gap:22px; }
  .auth-side-quote{ font-family:'Fraunces',serif; font-style:italic; font-size:15px; line-height:1.6; color:rgba(241,236,221,0.88); margin:0; }
  .auth-side-card{ margin-top:auto; border:1px dashed rgba(241,236,221,0.35); border-radius:4px; padding:12px 14px; font-size:10.5px; letter-spacing:0.05em; }
  .auth-side-card-row{ display:flex; justify-content:space-between; }
  .auth-form-panel{ flex:1; background:var(--parchment-light); padding:34px 36px; display:flex; flex-direction:column; }
  .auth-tabs{ display:flex; gap:6px; margin-bottom:22px; background:var(--parchment); border-radius:20px; padding:4px; width:fit-content; }
  .auth-tab{ border:none; background:transparent; padding:7px 16px; border-radius:16px; font-family:'Fraunces',serif; font-weight:600; font-size:12.5px; cursor:pointer; color:var(--charcoal); opacity:0.6; }
  .auth-tab-active{ background:var(--ink); color:var(--parchment-light); opacity:1; }
  .auth-heading{ font-size:22px; font-weight:600; margin:0 0 4px; }
  .auth-subheading{ font-size:13px; opacity:0.65; margin:0 0 22px; }
  .input-with-icon{ display:flex; align-items:center; gap:8px; border:1px solid var(--line); background:var(--parchment); border-radius:3px; padding:0 11px; margin-bottom:14px; color:var(--charcoal); opacity:0.85; }
  .input-with-icon:focus-within{ border-color:var(--gold); }
  .input-with-icon .auth-input{ border:none; background:transparent; margin-bottom:0; padding:9px 0; }
  .input-with-icon .auth-input:focus{ border-color:transparent; }
  .auth-error{ font-size:12px; color:var(--burgundy); background:rgba(107,39,55,0.08); border:1px solid rgba(107,39,55,0.25); border-radius:3px; padding:8px 10px; margin-bottom:14px; }
  .auth-submit{ width:100%; justify-content:center; padding:11px; font-size:14px; margin-top:4px; }
  .auth-switch{ font-size:12.5px; text-align:center; margin-top:18px; opacity:0.75; }
  .auth-switch button{ background:none; border:none; color:var(--burgundy); font-weight:600; cursor:pointer; padding:0; font-family:inherit; font-size:inherit; text-decoration:underline; }
  .auth-note{ font-size:10px; opacity:0.45; text-align:center; margin-top:auto; padding-top:18px; }
  .logout-btn{ margin-left:auto; background:none; border:none; cursor:pointer; color:var(--charcoal); opacity:0.5; display:flex; align-items:center; }
  .logout-btn:hover{ opacity:1; color:var(--burgundy); }

  @media (max-width: 860px){
    .sidebar{ display:none; }
    .main{ padding:18px; }
    .feed-layout{ flex-direction:column; }
    .feed-aside{ width:100%; }
  }
  @media (max-width: 640px){
    .auth-side{ display:none; }
    .auth-card{ max-width:420px; }
  }
</style>
</head>

function AuthScreen({ onAuth }) {
  const [mode, setMode] = useState("signin"); // 'signin' | 'signup'
  const [form, setForm] = useState({ name: "", handle: "", email: "", password: "", confirm: "" });
  const [error, setError] = useState("");

  function update(field, value) {
    setForm({ ...form, [field]: value });
    if (error) setError("");
  }

  function submit(e) {
    e.preventDefault();
    if (!form.email.trim() || !form.password.trim()) {
      setError("Please fill in your email and password.");
      return;
    }
    if (mode === "signup") {
      if (!form.name.trim()) { setError("Please tell us your name."); return; }
      if (form.password.length < 6) { setError("Password should be at least 6 characters."); return; }
      if (form.password !== form.confirm) { setError("Passwords don't match."); return; }
      const handle = form.handle.trim()
        ? "@" + form.handle.trim().replace(/^@/, "")
        : "@" + form.name.trim().toLowerCase().replace(/[^a-z0-9]+/g, "");
      onAuth({ name: form.name.trim(), handle });
    } else {
      const guessedName = form.email.split("@")[0].replace(/[._]/g, " ");
      const niceName = guessedName.replace(/\b\w/g, (c) => c.toUpperCase());
      onAuth({ name: niceName || "Reader", handle: "@" + guessedName.replace(/\s+/g, "").toLowerCase() });
    }
  }

  return (
    <div className="auth-page">
      <div className="auth-card">
        <div className="auth-side">
          <div className="brand-mark" style={{ color: "var(--parchment-light)" }}>
            <Icon name="book-open" size={24} />
            <span className="brand-title">Marginalia</span>
          </div>
          <p className="auth-side-quote">
            &ldquo;A home for readers &amp; writers &mdash; keep your shelf, follow the stories of others,
            and leave a note in the margins.&rdquo;
          </p>
          <div className="auth-side-card mono">
            <div className="auth-side-card-row">
              <span>MEMBER CARD</span>
              <span>NO. {mode === "signup" ? "\u2014" : "0000"}</span>
            </div>
            <div className="auth-side-card-row" style={{ opacity: 0.6, marginTop: 6 }}>
              <span>ISSUED</span>
              <span>16 AUG</span>
            </div>
          </div>
        </div>

        <div className="auth-form-panel">
          <div className="auth-tabs">
            <button className={`auth-tab ${mode === "signin" ? "auth-tab-active" : ""}`} onClick={() => { setMode("signin"); setError(""); }}>
              Sign In
            </button>
            <button className={`auth-tab ${mode === "signup" ? "auth-tab-active" : ""}`} onClick={() => { setMode("signup"); setError(""); }}>
              New Card
            </button>
          </div>

          <h2 className="auth-heading">{mode === "signin" ? "Welcome back" : "Get your library card"}</h2>
          <p className="auth-subheading">
            {mode === "signin" ? "Sign in to pick up where you left off." : "Join Marginalia to start your shelf."}
          </p>

          <form onSubmit={submit}>
            {mode === "signup" && (
              <>
                <label className="field-label">Name</label>
                <div className="input-with-icon">
                  <Icon name="user-round" size={15} />
                  <input className="field-input auth-input" placeholder="Wren Ashby" value={form.name} onChange={(e) => update("name", e.target.value)} />
                </div>
                <label className="field-label">Handle (optional)</label>
                <div className="input-with-icon">
                  <span className="mono" style={{ fontSize: 13, opacity: 0.55 }}>@</span>
                  <input className="field-input auth-input" placeholder="wrenwrites" value={form.handle} onChange={(e) => update("handle", e.target.value.replace(/^@/, ""))} />
                </div>
              </>
            )}

            <label className="field-label">Email</label>
            <div className="input-with-icon">
              <Icon name="mail" size={15} />
              <input className="field-input auth-input" type="email" placeholder="you@example.com" value={form.email} onChange={(e) => update("email", e.target.value)} />
            </div>

            <label className="field-label">Password</label>
            <div className="input-with-icon">
              <Icon name="lock" size={15} />
              <input className="field-input auth-input" type="password" placeholder="\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022" value={form.password} onChange={(e) => update("password", e.target.value)} />
            </div>

            {mode === "signup" && (
              <>
                <label className="field-label">Confirm password</label>
                <div className="input-with-icon">
                  <Icon name="lock" size={15} />
                  <input className="field-input auth-input" type="password" placeholder="\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022" value={form.confirm} onChange={(e) => update("confirm", e.target.value)} />
                </div>
              </>
            )}

            {error && <div className="auth-error">{error}</div>}

            <button type="submit" className="btn-primary auth-submit">
              {mode === "signin" ? "Sign in" : "Create my card"}
            </button>
          </form>

          <p className="auth-switch">
            {mode === "signin" ? (
              <>New to Marginalia? <button onClick={() => { setMode("signup"); setError(""); }}>Get a card</button></>
            ) : (
              <>Already a member? <button onClick={() => { setMode("signin"); setError(""); }}>Sign in</button></>
            )}
          </p>
          <p className="auth-note mono">This is a demo &mdash; no real account is created and nothing is sent anywhere.</p>
        </div>
      </div>
    </div>
  );
}

function Marginalia() {
  const [isAuthed, setIsAuthed] = useState(false);
  const [view, setView] = useState("feed");
  const [posts, setPosts] = useState(initialPosts);
  const [newPost, setNewPost] = useState("");
  const [profile, setProfile] = useState(initialProfile);
  const [editingProfile, setEditingProfile] = useState(false);
  const [draft, setDraft] = useState(initialProfile);
  const [following, setFollowing] = useState(new Set(["@margueritewrites", "@tkwan.stories"]));
  const [conversations, setConversations] = useState(initialConversations);
  const [activeConvoId, setActiveConvoId] = useState(initialConversations[0].id);
  const [messageDraft, setMessageDraft] = useState("");
  const scrollRef = useRef(null);

  const activeConvo = conversations.find((c) => c.id === activeConvoId);

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [activeConvoId, conversations]);

  function submitPost() {
    if (!newPost.trim()) return;
    setPosts([
      { id: Date.now(), author: profile.name, handle: profile.handle, time: "now", date: "16 AUG", content: newPost.trim(), book: null, likes: 0, comments: 0, liked: false },
      ...posts,
    ]);
    setNewPost("");
  }

  function toggleLike(id) {
    setPosts(posts.map((p) => (p.id === id ? { ...p, liked: !p.liked, likes: p.liked ? p.likes - 1 : p.likes + 1 } : p)));
  }

  function toggleFollow(handle) {
    const next = new Set(following);
    next.has(handle) ? next.delete(handle) : next.add(handle);
    setFollowing(next);
  }

  function saveProfile() {
    setProfile(draft);
    setEditingProfile(false);
  }

  function handleAuth({ name, handle }) {
    setProfile((p) => ({ ...p, name, handle }));
    setIsAuthed(true);
  }

  function handleLogout() {
    setIsAuthed(false);
    setView("feed");
  }

  function sendMessage() {
    if (!messageDraft.trim()) return;
    setConversations(conversations.map((c) =>
      c.id === activeConvoId
        ? { ...c, unread: false, lastMessage: messageDraft.trim(), messages: [...c.messages, { from: "me", text: messageDraft.trim(), time: "now" }] }
        : c
    ));
    setMessageDraft("");
  }

  if (!isAuthed) {
    return (
      <div className="app-root">
        <AuthScreen onAuth={handleAuth} />
      </div>
    );
  }

  return (
    <div className="app-root">
      <div className="shell">
        <aside className="sidebar">
          <div className="brand">
            <div className="brand-mark">
              <Icon name="book-open" size={22} />
              <span className="brand-title">Marginalia</span>
            </div>
            <div className="brand-tag">a home for readers &amp; writers</div>
          </div>

          <div className="catalog">
            <div className="catalog-caption">Card Catalog</div>
            <DrawerButton label="The Commons" sub="FIC \u2013 GEN" iconName="users" active={view === "feed"} onClick={() => setView("feed")} />
            <DrawerButton label="Your Card" sub="SELF" iconName="feather" active={view === "profile"} onClick={() => setView("profile")} />
            <DrawerButton
              label="Correspondence"
              sub="LTRS"
              iconName="message-circle"
              active={view === "messages"}
              onClick={() => setView("messages")}
              badge={conversations.some((c) => c.unread) ? conversations.filter((c) => c.unread).length : null}
            />
            <DrawerButton label="The Stacks" sub="REF" iconName="library" active={view === "library"} onClick={() => setView("library")} />
          </div>

          <div className="sidebar-foot">
            <Avatar name={profile.name} size={34} />
            <div>
              <div className="sidebar-foot-name">{profile.name}</div>
              <div className="sidebar-foot-handle">{profile.handle}</div>
            </div>
            <button className="logout-btn" onClick={handleLogout} title="Log out">
              <Icon name="log-out" size={16} />
            </button>
          </div>
        </aside>

        <main className="main">
          {view === "feed" && (
            <>
              <div className="main-header">
                <div>
                  <h1 className="main-title">The Commons</h1>
                  <div className="main-sub">Updates from the writers and readers you follow</div>
                </div>
              </div>

              <div className="feed-layout">
                <div className="feed-main">
                  <div className="card composer">
                    <textarea placeholder="What are you reading, writing, or thinking about today?" value={newPost} onChange={(e) => setNewPost(e.target.value)} />
                    <div className="composer-foot">
                      <span className="mono" style={{ fontSize: 11, opacity: 0.5 }}>posting as {profile.handle}</span>
                      <button className="btn-primary" onClick={submitPost} disabled={!newPost.trim()}>
                        <Icon name="pen-line" size={14} /> Post
                      </button>
                    </div>
                  </div>

                  {posts.map((p) => (
                    <article key={p.id} className="card post">
                      <div className="post-head">
                        <div className="post-who">
                          <Avatar name={p.author} size={38} bg={p.author === profile.name ? "var(--burgundy)" : "var(--moss)"} />
                          <div>
                            <div className="post-name">{p.author}</div>
                            <div className="post-handle">{p.handle} &middot; {p.time}</div>
                          </div>
                        </div>
                        <Stamp text={p.date} />
                      </div>
                      <p className="post-body">{p.content}</p>
                      {p.book && <div className="post-book">&#128214; currently reading &mdash; {p.book}</div>}
                      <div className="post-foot">
                        <button className={`btn-ghost ${p.liked ? "liked" : ""}`} onClick={() => toggleLike(p.id)}>
                          <Icon name="heart" size={14} fill={p.liked ? "var(--burgundy)" : "none"} /> {p.likes}
                        </button>
                        <button className="btn-ghost">
                          <Icon name="message-square" size={14} /> {p.comments}
                        </button>
                        <button className="btn-ghost">
                          <Icon name="bookmark" size={14} /> save
                        </button>
                      </div>
                    </article>
                  ))}
                </div>

                <div className="feed-aside">
                  <div className="card aside-card">
                    <div className="aside-title">Writers to follow</div>
                    {suggestedFollows.map((s) => (
                      <div key={s.handle} className="suggest-row">
                        <Avatar name={s.name} size={30} bg="var(--gold)" />
                        <div>
                          <div className="suggest-name">{s.name}</div>
                          <div className="suggest-handle">{s.handle}</div>
                        </div>
                        <button className={`follow-pill ${following.has(s.handle) ? "active" : ""}`} onClick={() => toggleFollow(s.handle)}>
                          {following.has(s.handle) ? "Following" : "Follow"}
                        </button>
                      </div>
                    ))}
                  </div>

                  <div className="card aside-card">
                    <div className="aside-title">This week on Marginalia</div>
                    <p style={{ fontSize: 12.5, lineHeight: 1.6, opacity: 0.75, margin: 0 }}>
                      412 chapters drafted, 1,204 books logged, and one very long argument about the Oxford comma.
                    </p>
                  </div>
                </div>
              </div>
            </>
          )}

          {view === "profile" && (
            <>
              <div className="main-header">
                <div>
                  <h1 className="main-title">Your Card</h1>
                  <div className="main-sub">How other readers see you on Marginalia</div>
                </div>
                {!editingProfile ? (
                  <button className="btn-secondary" onClick={() => { setDraft(profile); setEditingProfile(true); }}>
                    <Icon name="edit-3" size={13} style={{ marginRight: 6, display: "inline" }} /> Edit card
                  </button>
                ) : (
                  <div style={{ display: "flex", gap: 8 }}>
                    <button className="btn-secondary" onClick={() => setEditingProfile(false)}>Cancel</button>
                    <button className="btn-primary" onClick={saveProfile}><Icon name="check" size={14} /> Save</button>
                  </div>
                )}
              </div>

              <div className="card profile-card">
                {!editingProfile ? (
                  <>
                    <div className="profile-top">
                      <Avatar name={profile.name} size={64} bg="var(--burgundy)" />
                      <div>
                        <div className="profile-name">{profile.name}</div>
                        <div className="profile-handle">{profile.handle}</div>
                        <p className="profile-bio">{profile.bio}</p>
                        <div className="profile-loc">&#128205; {profile.location}</div>
                      </div>
                    </div>
                    <div className="profile-stats">
                      <div><div className="stat-num">{profile.booksRead}</div><div className="stat-label">Books logged</div></div>
                      <div><div className="stat-num">{profile.followers}</div><div className="stat-label">Followers</div></div>
                      <div><div className="stat-num">{profile.followingCount}</div><div className="stat-label">Following</div></div>

                ) : (
                  <div style={{ maxWidth: 440 }}>

                    <input className="field-input" value={draft.name} onChange={(e) => setDraft({ ...draft, name: e.target.value })} />
                    <label className="field-label">Handle</label>
                    <input className="field-input" value={draft.handle} onChange={(e) => setDraft({ ...draft, handle: e.target.value })} />
                    <label className="field-label">Bio</label>
                    <textarea className="field-textarea" value={draft.bio} onChange={(e) => setDraft({ ...draft, bio: e.target.value })} />
                    <label className="field-label">Location</label>
                    <input className="field-input" value={draft.location} onChange={(e) => setDraft({ ...draft, location: e.target.value })} />
                  </div>
                )}
              </div>

              <div className="shelf-section-title">Currently reading</div>
              <div className="reading-row">
                {profile.currentlyReading.map((b) => (
                  <div key={b.title} className="reading-card" style={{ background: b.color }}>

                      <div className="mono" style={{ fontSize: 10, opacity: 0.85 }}>{b.author}</div>
                    </div>
                  </div>
                ))}
              </div>

              <div className="shelf-section-title">Bookshelf</div>
              <div className="book-grid">
                {profile.shelf.map((b) => (
                  <div key={b.title} className="book-spine" style={{ background: b.color }}>
                    <div className="book-spine-title">{b.title}</div>
                    <div className="book-spine-author">{b.author}</div>
                  </div>
                ))}
              </div>
            </>
          )}

          {view === "messages" && (
            <>
              <div className="main-header">
                <div>
                  <h1 className="main-title">Correspondence</h1>
                  <div className="main-sub">Direct messages with fellow writers</div>
                </div>
              </div>

              <div className="msg-shell">

                      </div>

                <div className="thread">
